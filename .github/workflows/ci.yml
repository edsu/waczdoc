name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The end-to-end test renders a fixture WACZ to PDF through wabac in
      # headless Chromium, so the browser (and its system deps) must be present.
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Test
        run: npm test
